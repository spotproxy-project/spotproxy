services:
  nat:
    build:
      context: .
      dockerfile: NAT3Dockerfile
    container_name: nat-server
    networks:
      vpn_network:
        ipv4_address: 54.90.59.253
    ports:
      - "8000:8000"
    #    environment:
      # - PYTHONUNBUFFERED=1
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_ADMIN
    sysctls:
      - net.ipv4.ip_forward=1
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        tag: "{{.Name}}"
    volumes:
      - ./logs/nat:/app/logs
    deploy:
      resources:
        limits:
          cpus: "3.0"
          memory: "512M"
        reservations:
          cpus: "2.0"
  peer:
    build:
      context: .
      dockerfile: Peer1Dockerfile
    container_name: peer-client
    depends_on:
      - proxy
    networks:
      vpn_network:
        ipv4_address: 54.90.0.2
    environment:
      - PYTHONUNBUFFERED=1
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
      - NET_RAW
    privileged: true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        tag: "{{.Name}}"
    volumes:
      - ./logs/client:/app/logs
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "512M"
        reservations:
          cpus: "2.0"
  proxy:
    build:
      context: .
      dockerfile: Server4Dockerfile
    container_name: proxy-server
    depends_on:
      - nat
    networks:
      vpn_network:
        ipv4_address: 54.90.191.175
    volumes:
      - ./key_store/server:/etc/wireguard
      - ./logs/proxy:/app/logs
    environment:
      - GO111MODULE=on
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_ADMIN
    sysctls:
      - net.ipv4.ip_forward=1
    devices:
      - /dev/net/tun:/dev/net/tun
    privileged: true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        tag: "{{.Name}}"
    deploy:
      resources:
        limits:
          cpus: "3.0" 
          memory: "512M"
        reservations:
          cpus: "1.0"

networks:
  vpn_network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: "54.90.0.0/16"
          gateway: "54.90.0.1"
